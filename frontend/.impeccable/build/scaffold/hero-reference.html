<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: 03-table-led.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6f6f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1487px">
  <div class="r-sidebar-top region chrome" data-region="sidebar-top"><!-- solid blue navigation rail with brand and queue controls --></div>
  <div class="r-sidebar-bottom region chrome" data-region="sidebar-bottom"><!-- continuation of solid blue navigation rail with Settings control --></div>
  <div class="r-page-heading region text" data-region="page-heading"><!-- bold Demo inbox heading --><p style="font-size:var(--r-page-heading-font);font-family:var(--r-page-heading-family),sans-serif;font-weight:var(--r-page-heading-weight);line-height:1.05;margin:0">page-heading</p></div>
  <div class="r-page-subtitle region text" data-region="page-subtitle"><!-- assistant email context and demo no live sync disclosure --><p style="font-size:var(--r-page-subtitle-font);line-height:1.05;margin:0">page-subtitle</p></div>
  <div class="r-filters region control" data-region="filters"><!-- search and three filters in bordered fields: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop filters); a control need not have button chrome --></div>
  <div class="r-list-meta region text" data-region="list-meta"><!-- 25 conversations count --><p style="font-size:var(--r-list-meta-font);line-height:1.05;margin:0">list-meta</p></div>
  <div class="r-sort region control" data-region="sort"><!-- Most recent sort control: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop sort); a control need not have button chrome --></div>
  <div class="r-table-head region chrome" data-region="table-head"><!-- five column table header and square selection control --></div>
  <div class="r-selected-row region control" data-region="selected-row"><!-- selected Maya Chen row with blue highlight and review badge: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop selected-row); a control need not have button chrome --></div>
  <div class="r-table-rows-upper region chrome" data-region="table-rows-upper"><!-- upper conversation rows with sender subject client time and responsibility --></div>
  <div class="r-table-rows-lower region chrome" data-region="table-rows-lower"><!-- lower conversation rows with sender subject client time and responsibility --></div>
  <div class="r-review-banner region control" data-region="review-banner"><!-- large citron Needs review banner with count and description: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop review-banner); a control need not have button chrome --></div>
  <div class="r-detail-heading region text" data-region="detail-heading"><!-- Maya Chen Contract signature heading --><p style="font-size:var(--r-detail-heading-font);line-height:1.05;margin:0">detail-heading</p></div>
  <div class="r-detail-meta region text" data-region="detail-meta"><!-- client company and time metadata --><p style="font-size:var(--r-detail-meta-font);line-height:1.05;margin:0">detail-meta</p></div>
  <div class="r-suggestion-card region control" data-region="suggestion-card"><!-- bordered Relay suggestion card with client reply decision and rationale: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop suggestion-card); a control need not have button chrome --></div>
  <div class="r-assign-primary region control" data-region="assign-primary"><!-- solid blue Assign to client action within suggestion area: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop assign-primary); a control need not have button chrome --></div>
  <div class="r-ownership-title region text" data-region="ownership-title"><!-- Signature move ownership heading --><p style="font-size:var(--r-ownership-title-font);line-height:1.05;margin:0">ownership-title</p></div>
  <div class="r-ownership-route region control" data-region="ownership-route"><!-- three step ownership route with circular nodes and labels: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop ownership-route); a control need not have button chrome --></div>
  <div class="r-thread-heading region text" data-region="thread-heading"><!-- Thread heading --><p style="font-size:var(--r-thread-heading-font);line-height:1.05;margin:0">thread-heading</p></div>
  <div class="r-thread-count region text" data-region="thread-count"><!-- three messages count --><p style="font-size:var(--r-thread-count-font);line-height:1.05;margin:0">thread-count</p></div>
  <div class="r-thread-first region chrome" data-region="thread-first"><!-- first message excerpt with avatar sender time and body --></div>
  <div class="r-thread-second region chrome" data-region="thread-second"><!-- second message excerpt with avatar sender time body and attachment --></div>
  <div class="r-thread-third region chrome" data-region="thread-third"><!-- third message excerpt with avatar sender time and body --></div>
  <div class="r-open-conversation region control" data-region="open-conversation"><!-- outlined Open full conversation button: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop open-conversation); a control need not have button chrome --></div>
</main>
</body>
</html>
